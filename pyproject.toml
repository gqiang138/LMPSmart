[project]
name = "lmpsmart"
version = "1.0.0"
description = "LAMMPS Molecular Dynamics Data Agent — Config-Driven Parse, Smooth, Filter with LLM Planning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Qiang Gan"}
]
keywords = ["lammps", "molecular-dynamics", "reaxff", "data-processing", "smart-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "pywavelets>=1.4.0",
    "openpyxl>=3.1.0",
    "chardet>=5.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
chem = [
    "rdkit>=2024.0.0",
    "openbabel>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
all = [
    "lmpsmart[chem,dev]",
]

[project.scripts]
lmpsmart = "lmpsmart.cli:main"

[project.urls]
Homepage = "https://github.com/qgan2025/lmpsmart"
Documentation = "https://qgan2025.github.io/lmpsmart"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmpsmart"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
